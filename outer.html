<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outer Custom - GreenYouth</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:
    linear-gradient(
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.65)
    ),
    url('bgouter.jpg');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    min-height:100vh;
}

.container{
    max-width:1200px;
    margin:40px auto;
    padding:20px;
}

h1{
    color:white;
    text-align:center;
    margin-bottom:10px;
}

.sub{
    color:white;
    text-align:center;
    margin-bottom:35px;
}

.produk-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
}

.card img{
    width:100%;
    height:260px;
    object-fit:cover;
}

.card h3{
    text-align:center;
    padding:15px;
    color:#1b4332;
}

.card p{
    text-align:center;
    padding-bottom:20px;
    color:#555;
}

.form-container{

    display:none;

    max-width:950px;

    margin:40px auto;

    background:white;

    border-radius:20px;

    padding:30px;

    animation:muncul 0.5s ease;
}

@keyframes muncul{

    from{
        opacity:0;
        transform:translateY(50px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.form-container h2{
    text-align:center;
    color:#1b4332;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

select,
input[type="number"],
input[type="file"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    margin-top:20px;

    cursor:pointer;

    font-size:16px;
}

.btn-hitung{
    background:#1b4332;
    color:white;
}

.btn-kembali{
    background:#888;
    color:white;
}

.total{

    margin-top:20px;

    background:#d8f3dc;

    padding:20px;

    border-radius:10px;

    font-size:24px;

    font-weight:bold;

    text-align:center;
}

.detail{

    margin-top:15px;

    background:#f5f5f5;

    padding:15px;

    border-radius:10px;
}

#preview{
    width:250px;
    display:block;
    margin:20px auto;
    border-radius:10px;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="container">

<h1>Outer Custom GreenYouth</h1>

<p class="sub">
Pilih jenis outer yang ingin kamu pesan
</p>

<div class="produk-grid">

<div class="card" onclick="pilihOuter('Jaket',110000)">
<img src="C:\Users\ASUS\Documents\Custom Office Templates\Sublime Text\CSS\GY\images\jaket.jpeg">
<h3>Jaket</h3>
<p>Rp110.000</p>
</div>

<div class="card" onclick="pilihOuter('Hoodie',100000)">
<img src="C:\Users\ASUS\Documents\Custom Office Templates\Sublime Text\CSS\GY\images\hoodie.jpeg">
<h3>Hoodie</h3>
<p>Rp100.000</p>
</div>

<div class="card" onclick="pilihOuter('Vest',80000)">
<img src="C:\Users\ASUS\Documents\Custom Office Templates\Sublime Text\CSS\GY\images\vest.jpeg">
<h3>Vest</h3>
<p>Rp80.000</p>
</div>

<div class="card" onclick="pilihOuter('Windbreaker',100000)">
<img src="C:\Users\ASUS\Documents\Custom Office Templates\Sublime Text\CSS\GY\images\windbreaker.jpeg">
<h3>Windbreaker</h3>
<p>Rp100.000</p>
</div>

<div class="card" onclick="pilihOuter('Bomber',110000)">
<img src="C:\Users\ASUS\Documents\Custom Office Templates\Sublime Text\CSS\GY\images\bomber.jpeg">
<h3>Bomber</h3>
<p>Rp110.000</p>
</div>

<div class="card" onclick="pilihOuter('Half Zip',75000)">
<img src="C:\Users\ASUS\Documents\Custom Office Templates\Sublime Text\CSS\GY\images\halfzip.jpeg">
<h3>Half Zip</h3>
<p>Rp75.000</p>
</div>

<div class="card" onclick="pilihOuter('Crewneck',70000)">
<img src="C:\Users\ASUS\Documents\Custom Office Templates\Sublime Text\CSS\GY\images\crewneck.jpeg">
<h3>Crewneck</h3>
<p>Rp70.000</p>
</div>

</div>

</div>

<div class="form-container" id="formPesanan">

<h2 id="judulOuter">
Pesan Outer
</h2>

<input type="hidden" id="hargaOuter">

<label>Warna Outer</label>

<select id="warna">
<option>Hitam</option>
<option>Putih</option>
<option>Navy</option>
<option>Abu Misty</option>
<option>Maroon</option>
<option>Hijau Army</option>
<option>Merah</option>
<option>Biru Royal</option>
</select>

<label>Jenis Sablon</label>

<select id="sablon">

<option value="30000">
Dada atau Punggung Atas - Rp30.000
</option>

<option value="40000">
Depan Full atau Belakang Full - Rp40.000
</option>

<option value="60000">
1 Kecil + 1 Besar - Rp60.000
</option>

<option value="80000">
Depan & Belakang Full - Rp80.000
</option>

</select>

<h3 style="margin-top:20px">
Jumlah per Size
</h3>

<div class="grid">

<div>
<label>M</label>
<input type="number" id="m" value="0" min="0">
</div>

<div>
<label>L</label>
<input type="number" id="l" value="0" min="0">
</div>

<div>
<label>XL</label>
<input type="number" id="xl" value="0" min="0">
</div>

<div>
<label>XXL (+Rp10.000)</label>
<input type="number" id="xxl" value="0" min="0">
</div>

</div>

<label>Upload Desain</label>

<input type="file" id="desain" accept="image/*">

<img id="preview">

<!-- PART 2 -->
<button class="btn-hitung" onclick="hitungHarga()">
Hitung Harga
</button>

<button class="btn-kembali" onclick="kembaliMenu()">
Kembali ke Menu Outer
</button>

<div class="total" id="hasil">
Total Harga: Rp0
</div>

<div class="detail" id="detail">
Belum ada perhitungan.
</div>

</div>

<script>

let namaOuter = "";
let hargaDasarOuter = 0;

function pilihOuter(nama,harga){

    namaOuter = nama;
    hargaDasarOuter = harga;

    document.getElementById("judulOuter").innerHTML =
    "Pesan " + nama;

    document.getElementById("hargaOuter").value =
    harga;

    document.querySelector(".container").style.display =
    "none";

    document.getElementById("formPesanan").style.display =
    "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function kembaliMenu(){

    document.querySelector(".container").style.display =
    "block";

    document.getElementById("formPesanan").style.display =
    "none";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

document
.getElementById("desain")
.addEventListener("change",function(){

    let file=this.files[0];

    if(file){

        let reader=new FileReader();

        reader.onload=function(e){

            document
            .getElementById("preview")
            .src=e.target.result;

        }

        reader.readAsDataURL(file);

    }

});

function hitungHarga(){

    let hargaOuter =
    parseInt(document.getElementById("hargaOuter").value);

    let sablon =
    parseInt(document.getElementById("sablon").value);

    let m =
    parseInt(document.getElementById("m").value) || 0;

    let l =
    parseInt(document.getElementById("l").value) || 0;

    let xl =
    parseInt(document.getElementById("xl").value) || 0;

    let xxl =
    parseInt(document.getElementById("xxl").value) || 0;

    let totalPcs =
    m+l+xl+xxl;

    if(totalPcs <= 0){

        alert("Masukkan jumlah pesanan terlebih dahulu");

        return;
    }

    let diskon = 0;

    if(totalPcs >= 12){

        diskon = 0.30;

    }

    let hargaSablonSetelahDiskon =
    sablon - (sablon * diskon);

    let totalOuter =

    (m * hargaOuter) +

    (l * hargaOuter) +

    (xl * hargaOuter) +

    (xxl * (hargaOuter + 10000));

    let totalSablon =
    totalPcs * hargaSablonSetelahDiskon;

    let totalHarga =
    totalOuter + totalSablon;

    document.getElementById("hasil").innerHTML =

    "Total Harga: Rp " +

    totalHarga.toLocaleString("id-ID");

    document.getElementById("detail").innerHTML =

    `
    <b>Jenis Outer:</b> ${namaOuter}<br>
    <b>Warna:</b> ${document.getElementById("warna").value}<br>
    <b>Total Pesanan:</b> ${totalPcs} pcs<br>
    <b>Diskon Sablon:</b> ${diskon*100}%<br>
    <b>Biaya Outer:</b>
    Rp ${totalOuter.toLocaleString("id-ID")}<br>
    <b>Biaya Sablon:</b>
    Rp ${totalSablon.toLocaleString("id-ID")}<br><br>

    Size M : ${m} pcs<br>
    Size L : ${l} pcs<br>
    Size XL : ${xl} pcs<br>
    Size XXL : ${xxl} pcs
    `;

}

</script>

</body>
</html>
