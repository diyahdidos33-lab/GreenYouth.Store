<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaos Custom - GreenYouth</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:
    linear-gradient(
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.65)
    ),
    url('https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=1600');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.container{

    max-width:900px;

    margin:40px auto;

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,0.3);

    animation:muncul 0.8s ease;
}

@keyframes muncul{

    from{
        opacity:0;
        transform:translateY(50px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

h1{
    text-align:center;
    color:#1b4332;
    margin-bottom:10px;
}

.sub{
    text-align:center;
    margin-bottom:30px;
    color:#666;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

select,
input[type="number"],
input[type="file"]{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:8px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

button{

    width:100%;

    margin-top:25px;

    padding:15px;

    background:#1b4332;

    color:white;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:16px;
}

button:hover{
    background:#2d6a4f;
}

#preview{

    width:250px;

    max-width:100%;

    display:block;

    margin:15px auto;

    border-radius:10px;
}

.total{

    margin-top:20px;

    background:#d8f3dc;

    padding:20px;

    border-radius:10px;

    font-size:24px;

    font-weight:bold;

    text-align:center;
}

.detail{

    margin-top:15px;

    background:#f8f9fa;

    padding:15px;

    border-radius:10px;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="container">

<h1>Kaos Custom GreenYouth</h1>

<p class="sub">
Pilih kualitas, warna, ukuran, dan upload desainmu
</p>

<label>Kualitas Kaos</label>

<select id="bahan">
    <option value="50000">30s - Rp50.000</option>
    <option value="70000">24s - Rp70.000</option>
    <option value="90000">20s - Rp90.000</option>
</select>

<label>Warna Kaos</label>

<select id="warna">
    <option>Hitam</option>
    <option>Putih</option>
    <option>Navy</option>
    <option>Abu Misty</option>
    <option>Hijau Army</option>
    <option>Maroon</option>
    <option>Merah</option>
    <option>Biru Royal</option>
    <option>Mustard</option>
</select>

<label>Jenis Sablon</label>

<select id="sablon">
    <option value="20000">Dada / Punggung Atas - Rp20.000</option>
    <option value="30000">Depan Full atau Belakang Full - Rp30.000</option>
    <option value="40000">Depan & Punggung Atas - Rp40.000</option>
    <option value="50000">1 Full + 1 Setengah - Rp50.000</option>
    <option value="60000">Depan & Belakang Full - Rp60.000</option>
</select>


<h3 style="margin-top:25px;">
Jumlah Pesanan
</h3>

<div class="grid">

<div>
<label>S Pendek</label>
<input type="number" id="sp" value="0" min="0">
</div>

<div>
<label>S Panjang (+Rp5.000)</label>
<input type="number" id="spl" value="0" min="0">
</div>

<div>
<label>M Pendek</label>
<input type="number" id="mp" value="0" min="0">
</div>

<div>
<label>M Panjang (+Rp5.000)</label>
<input type="number" id="mpl" value="0" min="0">
</div>

<div>
<label>L Pendek</label>
<input type="number" id="lp" value="0" min="0">
</div>

<div>
<label>L Panjang (+Rp5.000)</label>
<input type="number" id="lpl" value="0" min="0">
</div>

<div>
<label>XL Pendek</label>
<input type="number" id="xlp" value="0" min="0">
</div>

<div>
<label>XL Panjang (+Rp5.000)</label>
<input type="number" id="xlpl" value="0" min="0">
</div>

<div>
<label>XXL Pendek (+Rp5.000)</label>
<input type="number" id="xxlp" value="0" min="0">
</div>

<div>
<label>XXL Panjang (+Rp10.000)</label>
<input type="number" id="xxlpl" value="0" min="0">
</div>

<div>
<label>XXXL Pendek (+Rp5.000)</label>
<input type="number" id="xxxlp" value="0" min="0">
</div>

<div>
<label>XXXL Panjang (+Rp10.000)</label>
<input type="number" id="xxxlpl" value="0" min="0">
</div>

</div>


<label>Upload Desain</label>

<input
type="file"
id="desain"
accept="image/*">

<img id="preview">

<button onclick="hitungHarga()">
Hitung Harga
</button>

<div class="total" id="hasil">
Total Harga: Rp0
</div>

<div class="detail" id="detail">
Belum ada perhitungan.
</div>

</div>

<script>

document
.getElementById("desain")
.addEventListener("change",function(){

let file=this.files[0];

if(file){

let reader=new FileReader();

reader.onload=function(e){

document
.getElementById("preview")
.src=e.target.result;

}

reader.readAsDataURL(file);

}

});

function hitungHarga(){

let bahan =
parseInt(document.getElementById("bahan").value);

let sablon =
parseInt(document.getElementById("sablon").value);

let sp=+document.getElementById("sp").value;
let spl=+document.getElementById("spl").value;

let mp=+document.getElementById("mp").value;
let mpl=+document.getElementById("mpl").value;

let lp=+document.getElementById("lp").value;
let lpl=+document.getElementById("lpl").value;

let xlp=+document.getElementById("xlp").value;
let xlpl=+document.getElementById("xlpl").value;

let xxlp=+document.getElementById("xxlp").value;
let xxlpl=+document.getElementById("xxlpl").value;

let xxxlp=+document.getElementById("xxxlp").value;
let xxxlpl=+document.getElementById("xxxlpl").value;

let totalPcs =
sp+spl+
mp+mpl+
lp+lpl+
xlp+xlpl+
xxlp+xxlpl+
xxxlp+xxxlpl;

if(totalPcs <= 0){

alert("Masukkan jumlah pesanan.");
return;

}

let diskon =
totalPcs >= 12 ? 0.3 : 0;

let hargaSablon =
sablon - (sablon * diskon);

let totalBahan =

(sp*bahan)+
(spl*(bahan+5000))+

(mp*bahan)+
(mpl*(bahan+5000))+

(lp*bahan)+
(lpl*(bahan+5000))+

(xlp*bahan)+
(xlpl*(bahan+5000))+

(xxlp*(bahan+5000))+
(xxlpl*(bahan+10000))+

(xxxlp*(bahan+5000))+
(xxxlpl*(bahan+10000));

let totalSablon =
totalPcs * hargaSablon;

let total =
totalBahan + totalSablon;

document.getElementById("hasil").innerHTML =
"Total Harga: Rp " +
total.toLocaleString("id-ID");

document.getElementById("detail").innerHTML =
`
Jumlah Pesanan : <b>${totalPcs} pcs</b><br>
Diskon Sablon : <b>${diskon*100}%</b><br>
Warna Kaos : <b>${document.getElementById("warna").value}</b><br>
Biaya Bahan : Rp ${totalBahan.toLocaleString("id-ID")}<br>
Biaya Sablon : Rp ${totalSablon.toLocaleString("id-ID")}
`;

}

</script>

</body>
</html>
